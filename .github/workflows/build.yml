name: build

on:
  push:
    branches: [main, merge-kernel]
    tags: ['v*']
  pull_request:

# 打 tag 时要建 Release 并上传 exe → 需要写权限 (GITHUB_TOKEN 默认只读)
permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build (Release)
        run: dotnet build StereoSplitter.csproj -c Release --nologo

      - name: Route selftest (exit code gate)
        shell: pwsh
        run: |
          & ./bin/Release/net48/SplitterGUI.exe --selftest
          if ($LASTEXITCODE -ne 0) {
            if ($LASTEXITCODE -eq 3) {
              # F-26: report write failed - any log on disk is stale, do not dump it.
              Write-Host "::error::selftest report write failed (exit 3); on-disk log is stale"
              exit 3
            }
            Write-Host "::error::selftest failed (exit $LASTEXITCODE)"
            if (Test-Path ./bin/Release/net48/log/selftest-routing.txt) {
              Get-Content ./bin/Release/net48/log/selftest-routing.txt | ForEach-Object { Write-Host $_ }
            }
            exit $LASTEXITCODE
          }

      - name: Verify embedded NAudio (single-file distribution must not break)
        shell: pwsh
        run: |
          $exe = "./bin/Release/net48/SplitterGUI.exe"
          if (-not (Test-Path $exe)) { Write-Host "::error::exe missing"; exit 1 }

          # F-29: 断言最终 exe 真的内嵌了 NAudio.Core / NAudio.Wasapi。
          # 注意 Assembly.ReflectionOnlyLoadFrom 在 PowerShell 7 (.NET Core) 上抛
          # PlatformNotSupportedException —— 这一步曾在 CI 上 0 秒失败就是这样来的。
          # pwsh 7 改用 System.Reflection.Metadata 的 PEReader 读清单;
          # Windows PowerShell 5.1 没有该程序集, 保留反射分支。
          $names = @()
          try {
            if ($PSVersionTable.PSVersion.Major -ge 6) {
              $fs = [System.IO.File]::OpenRead((Resolve-Path $exe).Path)
              try {
                $pe = [System.Reflection.PortableExecutable.PEReader]::new($fs)
                try {
                  if (-not $pe.HasMetadata) { throw "PE has no CLI metadata" }
                  $mr = $pe.GetMetadataReader()
                  foreach ($h in $mr.ManifestResources) {
                    $names += $mr.GetString($mr.GetManifestResource($h).Name)
                  }
                } finally { $pe.Dispose() }
              } finally { $fs.Dispose() }
            } else {
              $asm = [System.Reflection.Assembly]::ReflectionOnlyLoadFrom((Resolve-Path $exe).Path)
              $names = @($asm.GetManifestResourceNames())
            }
          } catch {
            Write-Host "::error::failed to inspect embedded resources: $($_.Exception.Message)"
            exit 1
          }

          Write-Host ("embedded: " + ($names -join ', '))
          if ($names -notcontains 'NAudio.Core.dll' -or $names -notcontains 'NAudio.Wasapi.dll') {
            Write-Host "::error::NAudio.Core.dll / NAudio.Wasapi.dll resource missing - single-file fallback broken"
            exit 1
          }
          Write-Host "embedded NAudio resources present (Core + Wasapi)"

      # 打 tag (v*) 时: 用刚构建出的 exe 建 Release。
      # 说明文本取 .github/release-notes/<tag>.md, 首行 "# 标题" 同时用作 Release 标题;
      # 文件不存在则退回 GitHub 自动生成的提交列表。
      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = "$env:GITHUB_REF" -replace '^refs/tags/', ''
          $exe = "./bin/Release/net48/SplitterGUI.exe"
          if (-not (Test-Path $exe)) { Write-Host "::error::exe missing"; exit 1 }

          $notesFile = ".github/release-notes/$tag.md"
          $title = $tag
          $bodyFile = "release-notes.md"
          $useGenerated = $true
          if (Test-Path $notesFile) {
            $lines = @(Get-Content -Path $notesFile -Encoding UTF8)
            if ($lines.Count -gt 0 -and $lines[0].StartsWith('# ')) {
              $title = $lines[0].Substring(2).Trim()
              if ($lines.Count -gt 1) { $lines = $lines[1..($lines.Count - 1)] } else { $lines = @() }
            }
            $lines | Out-File -FilePath $bodyFile -Encoding utf8
            $useGenerated = $false
          }

          Write-Host "publishing release: tag=$tag title=$title"
          if ($useGenerated) {
            gh release create $tag $exe --title $title --generate-notes
          } else {
            gh release create $tag $exe --title $title --notes-file $bodyFile
          }
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::gh release create failed ($LASTEXITCODE)"; exit $LASTEXITCODE }
          Write-Host "release published: $tag"
